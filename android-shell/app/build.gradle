plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fuckds.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fuckds.app'
        minSdk 24
        // targetSdk 28：允许从应用私有目录 exec() 自带的 proot/node 二进制
        // （Android 10+ 对 targetSdk>=29 的应用禁止执行应用数据目录里的文件）
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // commons-compress 自带 LICENSE/META-INF 重复文件，排除掉避免构建冲突
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/DEPENDENCIES']
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 大体积 payload（rootfs.tar.gz / app.tar.gz / proot）不走 assets：
    // 由 scripts/ci/build-apk.sh 在 Gradle 构建完成后以 STORE 方式直接注入 APK，
    // 避免 aapt2 压缩阶段把 500MB 文件读进内存导致 Java heap space。

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 参考 IDAdroid：纯 Java 解 xz 与 tar，带进度、符号链接与权限支持
    implementation 'org.tukaani:xz:1.9'
    implementation 'org.apache.commons:commons-compress:1.26.1'
}
