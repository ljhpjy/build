plugins {
    id 'com.android.application'
}

// Version comes from version.properties so the manifest, the APK file name and
// the /healthz payload can never disagree again.
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def moduleVersionName = versionProps.getProperty('VERSION_NAME', '1.0.0').trim()
def moduleVersionCode = versionProps.getProperty('VERSION_CODE', '').trim()
if (moduleVersionCode.isEmpty()) {
    def p = moduleVersionName.tokenize('.')
    int major = p.size() > 0 ? (p[0] as int) : 1
    int minor = p.size() > 1 ? (p[1] as int) : 0
    int patch = p.size() > 2 ? (p[2] as int) : 0
    moduleVersionCode = (major * 10000 + minor * 100 + patch).toString()
}

android {
    namespace 'com.dsmod.deepseek'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsmod.deepseek"
        minSdk 24
        targetSdk 34
        versionCode moduleVersionCode.toInteger()
        versionName moduleVersionName
        // Exposed to Java so /healthz reports the exact installed version.
        buildConfigField "String", "VERSION_NAME", "\"${moduleVersionName}\""
    }

    def ksFile = file(System.getenv("KEYSTORE_FILE") ?: "dsmod.keystore")

    if (ksFile.exists()) {
        signingConfigs {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "dsmod123456"
                keyAlias System.getenv("KEY_ALIAS") ?: "dsmod"
                keyPassword System.getenv("KEY_PASSWORD") ?: "dsmod123456"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation', 'IconMissingDensityFolder'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
