name: fuckds Android APK（完整 Linux 环境）

# 把 fuckds 完整打包成 APK：
#   proot + Ubuntu 22.04 arm64 rootfs + Node.js 20 + Playwright Chromium (linux-arm64)
#   + Go 交叉编译的 bin/ds-pow，browser / direct 双引擎完整保留，源码零改动。
#
# 触发方式：
#   1. GitHub 仓库页面 → Actions → 本工作流 → Run workflow（可指定 Node 版本）
#   2. 推送 v* 标签自动触发
#
# 产物：fuckds-android-<时间戳>.apk（artifact 里下载）

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js 版本（>= 20.11）'
        required: false
        default: '20.18.1'
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NODE_VERSION: ${{ github.event.inputs.node_version || '20.18.1' }}
      npm_config_update_notifier: 'false'   # 消掉 npm 新版本 notice
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false   # 仓库无 go.sum（零依赖），关缓存消除告警

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK（runner 预装 SDK，兜底自动下载）
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CL="$SDK/cmdline-tools/latest"
          if [ ! -x "$CL/bin/sdkmanager" ]; then
            echo "未找到预装 SDK，下载 cmdline-tools…"
            sudo mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            sudo unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            sudo mv "$SDK/cmdline-tools/cmdline-tools" "$CL"
            sudo chmod -R a+rx "$CL"
          fi
          # 当前 step 内 PATH 尚未生效，必须用绝对路径调用 sdkmanager
          yes | "$CL/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CL/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # 以下环境变量在步骤结束才生效，供后续步骤（gradle/签名）使用
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CL/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls -d "$SDK/build-tools/34.0.0" "$SDK/platforms/android-34" && echo "SDK OK"

      - name: Setup QEMU + Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU（arm64 模拟，用于构建 rootfs）
        uses: docker/setup-qemu-action@v3

      - name: Cache signing keystore（跨构建复用，覆盖安装不丢）
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: android-shell/fuckds-release.jks
          key: fuckds-keystore-v1

      - name: Build APK（依赖 → ds-pow → app.tar.gz → rootfs → gradle → 签名）
        run: bash scripts/ci/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuckds-android-apk
          path: '*.apk'
          retention-days: 30
