name: Build Xposed Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/dsmod.keystore" \
            -alias dsmod \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass dsmod123456 -keypass dsmod123456 \
            -dname "CN=DSMod, OU=DeepSeek, O=DSMod, L=Local, S=Local, C=CN"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/dsmod.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: dsmod123456
          KEY_ALIAS: dsmod
          KEY_PASSWORD: dsmod123456
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsmod-deepseek-apk
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
